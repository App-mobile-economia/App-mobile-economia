services:
  - type: web
    name: economia-hoje
    runtime: static
    buildCommand: npm install && npx expo export -p web
    staticPublishPath: dist
    envVars:
      # Preencher no painel do Render (Environment). Ficam embutidas no build.
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
