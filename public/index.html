<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- PWA: manifesto (nome, ícones e cores do app instalado) e cor da barra do navegador -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="theme-color" content="#0D1117" />
    <!-- PWA: service worker (guarda arquivos para o app abrir mesmo sem internet) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
      }
    </script>
    <!-- Estilos básicos recomendados pelo react-native-web: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Estes estilos fazem a página ocupar a altura toda */
      html,
      body {
        height: 100%;
      }
      /* Estes estilos desligam a rolagem da página, porque as telas usam <ScrollView> */
      body {
        overflow: hidden;
      }
      /* Estes estilos fazem o elemento raiz do app ocupar a altura toda */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Mensagem para quem está com o JavaScript desligado (o app precisa dele para funcionar). -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- Elemento raiz: é aqui que o app aparece. -->
    <div id="root"></div>
  </body>
</html>
